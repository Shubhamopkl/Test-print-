## ⚡ 2. `render.yaml` (Root directory me)

```yaml
services:
  # 1. Express API Web Service
  - type: web
    name: scan-print-api
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm --prefix server install
    startCommand: npm --prefix server start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: FRONTEND_URL
        value: https://scan-print-web.onrender.com

  # 2. Vite + React Static Frontend
  - type: web
    name: scan-print-web
    runtime: static
    buildCommand: npm --prefix client install && npm --prefix client run build
    staticPublishPath: client/dist
    envVars:
      - key: VITE_API_URL
        value: https://scan-print-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
```

### `server/server.js`
```javascript
const express = require('express');
const cors = require('cors');

const app = express();
const PORT = process.env.PORT || 5000;

app.use(cors());
app.use(express.json());

// In-memory demo kiosk state
let kioskState = {
  kioskId: 'KP-4821',
  status: 'Online',
  printerModel: 'LaserJet Pro X400',
  tonerBlack: 88,
  paperCount: 340,
  paperMax: 500,
  fuserTemp: '195°C',
  ping: '12ms'
};

let rateCard = {
  bwSingle: 2.00,
  bwDuplex: 3.50,
  color: 8.00,
  glossy: 25.00
};

let orders = [
  { id: 'ORD-9021', customer: 'Aarav Mehta', pages: 14, type: 'Color', amount: 140, status: 'Printing', progress: '8/14' },
  { id: 'ORD-9020', customer: 'Neha Sharma', pages: 4, type: 'B&W', amount: 8, status: 'Waiting', progress: 'Queue #1' },
  { id: 'ORD-9019', customer: 'Vikram Rajput', pages: 32, type: 'Duplex B&W', amount: 64, status: 'Waiting', progress: 'Queue #2' }
];

// Health Check
app.get('/api/health', (req, res) => {
  res.json({ status: 'ok', time: new Date() });
});

// Telemetry & Rate Card
app.get('/api/kiosk/status', (req, res) => {
  res.json({ kiosk: kioskState, rateCard, queue: orders });
});

app.post('/api/kiosk/rate-card', (req, res) => {
  rateCard = { ...rateCard, ...req.body };
  res.json({ message: 'Rate card updated successfully', rateCard });
});

// Order creation & UPI checkout
app.post('/api/order/create', (req, res) => {
  const { fileName, pages, colorMode, duplex, copies, customerPhone } = req.body;
  
  let rate = colorMode === 'color' ? rateCard.color : (duplex ? rateCard.bwDuplex / 2 : rateCard.bwSingle);
  let totalAmount = (pages * rate * (copies || 1)).toFixed(2);
  let releasePin = Math.floor(1000 + Math.random() * 9000).toString();
  let orderId = 'ORD-' + Math.floor(1000 + Math.random() * 9000);

  const newOrder = {
    id: orderId,
    customer: customerPhone || 'Kiosk Guest',
    fileName: fileName || 'Document.pdf',
    pages,
    colorMode,
    amount: totalAmount,
    status: 'Ready',
    releasePin,
    createdAt: new Date()
  };

  orders.unshift(newOrder);

  res.json({
    success: true,
    orderId,
    totalAmount,
    releasePin,
    kioskId: kioskState.kioskId,
    upiIntentUrl: `upi://pay?pa=merchant@upi&pn=ScanPrintKiosk&am=${totalAmount}&tr=${orderId}&cu=INR`
  });
});

app.listen(PORT, '0.0.0.0', () => {
  console.log(`Scan to Print API running on port ${PORT}`);
});
```

import React from 'react';

export default function CustomerScanPrint({ orderData, setOrderData, onProceed }) {
  const calculateTotal = (colorMode, duplex, copies) => {
    const rate = colorMode === 'color' ? 8.00 : 2.00;
    return (orderData.pages * rate * copies).toFixed(2);
  };

  const handleColorChange = (mode) => {
    const total = calculateTotal(mode, orderData.duplex, orderData.copies);
    setOrderData({ ...orderData, colorMode: mode, total });
  };

  const handleDuplexChange = (isDuplex) => {
    setOrderData({ ...orderData, duplex: isDuplex });
  };

  const handleCopies = (delta) => {
    const next = Math.max(1, orderData.copies + delta);
    const total = calculateTotal(orderData.colorMode, orderData.duplex, next);
    setOrderData({ ...orderData, copies: next, total });
